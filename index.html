<!-- Floating Background Music Player -->
<button id="musicToggle" type="button" aria-label="Toggle background music" class="music-toggle-btn paused" title="Play / Pause Music">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l12-2v13"></path>
    <circle cx="6" cy="18" r="3"></circle>
    <circle cx="18" cy="16" r="3"></circle>
  </svg>
</button>
<audio id="weddingBgm" src="./editable/assets/bg-music.mp3" preload="auto" loop playsinline></audio>

<script>
  (function() {
    var audio = document.getElementById('weddingBgm');
    var btn = document.getElementById('musicToggle');
    if (!audio || !btn) return;

    if (window.WEDDING_DATA && window.WEDDING_DATA.music && window.WEDDING_DATA.music.src) {
      audio.src = window.WEDDING_DATA.music.src;
    }

    var isPlaying = false;
    function updateUI(playing) {
      isPlaying = playing;
      if (playing) {
        btn.classList.add('playing');
        btn.classList.remove('paused');
        btn.setAttribute('aria-pressed', 'true');
      } else {
        btn.classList.remove('playing');
        btn.classList.add('paused');
        btn.setAttribute('aria-pressed', 'false');
      }
    }

    audio.addEventListener('play', function() { updateUI(true); });
    audio.addEventListener('playing', function() { updateUI(true); });
    audio.addEventListener('pause', function() { updateUI(false); });
    audio.addEventListener('ended', function() { updateUI(false); });

    var unlockEvents = ['click', 'touchstart', 'touchend', 'scroll', 'keydown', 'pointerdown'];
    function removeUnlockListeners() {
      unlockEvents.forEach(function(evt) {
        window.removeEventListener(evt, onGesture, true);
        document.removeEventListener(evt, onGesture, true);
      });
    }

    function tryPlay() {
      if (!audio.paused && isPlaying) return;
      audio.muted = false;
      audio.volume = 1.0;
      var p = audio.play();
      if (p !== undefined) {
        p.then(function() {
          updateUI(true);
          removeUnlockListeners();
        }).catch(function(err) {
          updateUI(false);
        });
      }
    }

    window.playWeddingMusic = function() {
      tryPlay();
    };

    // Try auto-play on initial load
    tryPlay();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', tryPlay);
    }
    window.addEventListener('load', tryPlay);

    // Unlock on first interaction
    function onGesture() {
      tryPlay();
    }
    unlockEvents.forEach(function(evt) {
      window.addEventListener(evt, onGesture, { capture: true, passive: true });
      document.addEventListener(evt, onGesture, { capture: true, passive: true });
    });

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (audio.paused) {
        audio.play().then(function() {
          updateUI(true);
        }).catch(function() {});
      } else {
        audio.pause();
        updateUI(false);
      }
    });
  })();
</script>
